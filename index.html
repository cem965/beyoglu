<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#004D71">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Beyoğlu Sistemleri</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Roboto', sans-serif;
  background: linear-gradient(135deg, #004D71 0%, #0091B3 50%, #00c1a2 100%);
  min-height: 100vh;
}

/* PORTAL */
#portal {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 32px;
}
#portal.hidden { display: none; }

.portal-logo {
  text-align: center;
  margin-bottom: 48px;
}
.portal-logo h1 {
  font-size: 40px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 3px;
}
.portal-logo p {
  font-size: 11px;
  color: rgba(255,255,255,0.8);
  letter-spacing: 5px;
  margin-top: 6px;
  text-transform: uppercase;
}

.portal-cards {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 360px;
}

.portal-card {
  background: #fff;
  border-radius: 20px;
  padding: 32px 24px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  transition: transform .15s, box-shadow .15s;
  border: none;
  width: 100%;
}
.portal-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
.portal-card:active { transform: scale(0.97); }
.portal-card .icon { font-size: 56px; }
.portal-card h2 { font-size: 20px; font-weight: 900; }
.portal-card p { font-size: 12px; color: #666; text-align: center; line-height: 1.5; }

.portal-footer {
  margin-top: 32px;
  font-size: 11px;
  color: rgba(255,255,255,0.5);
}

/* APP FRAME */
#appFrame {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  flex-direction: column;
}
#appFrame.active { display: flex; }

#backBar {
  background: #0a0a12;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
#backBar button {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-family: 'Roboto', sans-serif;
}
#backBar span {
  color: rgba(255,255,255,0.6);
  font-size: 12px;
}

#appIframe {
  flex: 1;
  border: none;
  width: 100%;
}
</style>
</head>
<body>

<!-- PORTAL EKRANI -->
<div id="portal">
  <div class="portal-logo">
    <h1>BEYOĞLU</h1>
    <p>Sistemler</p>
  </div>

  <div class="portal-cards">
    <div class="portal-card" onclick="acApp('fuar')">
      <div class="icon">🏛️</div>
      <h2 style="color:#004D71">FUAR TAKİP</h2>
      <p>Stand projeleri · Fuar takvimi<br>Onaylı projeler takibi</p>
    </div>

    <div class="portal-card" onclick="acApp('ekran')">
      <div class="icon">📺</div>
      <h2 style="color:#0091B3">EKRAN KİRALAMA</h2>
      <p>Ekran siparişleri · Stok takibi<br>Rezervasyon yönetimi</p>
    </div>
  </div>

  <div class="portal-footer">Beyoğlu Görüntü Sistemleri © 2026</div>
</div>

<!-- APP FRAME -->
<div id="appFrame">
  <div id="backBar">
    <button onclick="portalaDon()">‹ Geri</button>
    <span id="appAdi"></span>
  </div>
  <iframe id="appIframe" src=""></iframe>
</div>

<script>
function acApp(tip) {
  const frame = document.getElementById('appFrame');
  const iframe = document.getElementById('appIframe');
  const adi = document.getElementById('appAdi');

  if (tip === 'fuar') {
    iframe.src = 'https://cem965.github.io/fuarapp/';
    adi.textContent = '🏛️ Fuar Takip';
  } else {
    iframe.src = 'https://cem965.github.io/ekranapp/';
    adi.textContent = '📺 Ekran Kiralama';
  }

  document.getElementById('portal').classList.add('hidden');
  frame.classList.add('active');
}

function portalaDon() {
  document.getElementById('appFrame').classList.remove('active');
  document.getElementById('appIframe').src = '';
  document.getElementById('portal').classList.remove('hidden');
}
</script>
</body>
</html>
